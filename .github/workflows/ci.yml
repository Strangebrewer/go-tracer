name: CI/CD

on:
  push:
  pull_request:

env:
  PROJECT_ID: personal-enterprise-493003
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/personal-enterprise-493003/personal-enterprise/go-tracer
  WIF_PROVIDER: projects/213672305641/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider
  SERVICE_ACCOUNT: personal-enterprise-run@personal-enterprise-493003.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy go-tracer-dev \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --max-instances 2 \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --set-secrets MONGODB_URI=tracer-mongo-uri:latest,JWT_PUBLIC_KEY=jwt-public-key:latest,SERVICE_KEY=tracer-service-key:latest \
            --set-env-vars ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }},SPAN_TTL_DAYS=7 \
            --allow-unauthenticated

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy go-tracer \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --max-instances 2 \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --set-secrets MONGODB_URI=tracer-mongo-uri:latest,JWT_PUBLIC_KEY=jwt-public-key:latest,SERVICE_KEY=tracer-service-key:latest \
            --set-env-vars ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }},SPAN_TTL_DAYS=7 \
            --allow-unauthenticated
